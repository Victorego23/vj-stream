<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="100%" height="100%">
  <defs>
    <!-- Gradientes Neón y Bisel Xuper TV -->
    <linearGradient id="iconNeonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A4D" />
      <stop offset="45%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#7A0006" />
    </linearGradient>

    <linearGradient id="iconCrystalPlay" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FF4B63" />
      <stop offset="70%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#800005" />
    </linearGradient>

    <linearGradient id="iconTitanium" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E0E3EB" />
      <stop offset="100%" stop-color="#9CA3AF" />
    </linearGradient>

    <linearGradient id="iconBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3142" />
      <stop offset="50%" stop-color="#141722" />
      <stop offset="100%" stop-color="#07080B" />
    </linearGradient>

    <linearGradient id="iconGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FF9900" />
    </linearGradient>

    <linearGradient id="iconGloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <filter id="iconNeonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Aura Resplandeciente Neón de Fondo -->
  <rect x="12" y="12" width="168" height="168" rx="46" fill="#E50914" opacity="0.38" filter="url(#iconNeonGlow)" />

  <!-- Marco Exterior Biselado Titanio OLED -->
  <rect x="12" y="12" width="168" height="168" rx="46" fill="url(#iconBezel)" stroke="url(#iconNeonGrad)" stroke-width="3" filter="url(#iconShadow)" />

  <!-- Pantalla Interior de Cine -->
  <rect x="22" y="22" width="148" height="148" rx="36" fill="#090A0F" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Reflejo Especular Diagonal (Gloss) -->
  <path d="M 22 56 C 22 37.2 37.2 22 56 22 L 138 22 C 150 22 158 30 160 42 L 22 120 Z" fill="url(#iconGloss)" opacity="0.75" />

  <!-- Anillo Pulsante Central de Sintonización -->
  <circle cx="96" cy="80" r="44" fill="none" stroke="url(#iconNeonGrad)" stroke-width="2" opacity="0.25" stroke-dasharray="8,5" />

  <!-- Botón Play 3D de Cristal Facetado -->
  <g transform="translate(80, 56)" filter="url(#iconNeonGlow)">
    <polygon points="0,0 0,48 40,24" fill="url(#iconNeonGrad)" />
    <polygon points="0,0 40,24 0,24" fill="url(#iconCrystalPlay)" opacity="0.95" />
    <polyline points="0,0 40,24 0,48" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />
  </g>

  <!-- LED Indicador VIP Online -->
  <circle cx="146" cy="38" r="4.5" fill="#00E676" filter="url(#iconNeonGlow)" />

  <!-- Cinta Inferior con Tipografía TOM TV Metálica -->
  <g transform="translate(28, 126)">
    <!-- Barra Base de Metal Oscuro -->
    <rect x="0" y="0" width="136" height="34" rx="10" fill="url(#iconNeonGrad)" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.3" filter="url(#iconShadow)" />
    <text x="68" y="24" font-family="'Outfit', 'Montserrat', sans-serif" font-weight="900" font-size="20" letter-spacing="3" fill="#FFFFFF" text-anchor="middle">
      TOM TV
    </text>
  </g>
</svg>
