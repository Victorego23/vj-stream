<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E27" />
      <stop offset="50%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#800005" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181A22" />
      <stop offset="100%" stop-color="#0A0B0E" />
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo Neón -->
  <rect x="8" y="8" width="176" height="176" rx="42" fill="#E50914" opacity="0.3" filter="url(#iconGlow)" />
  <rect x="8" y="8" width="176" height="176" rx="42" fill="url(#iconBgGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="3" />

  <!-- Pantalla TV Central -->
  <rect x="24" y="24" width="144" height="144" rx="30" fill="url(#screenGrad)" stroke="rgba(229,9,20,0.6)" stroke-width="2.5" />

  <!-- Texto TOM -->
  <text x="96" y="94" font-family="'Outfit', 'Impact', sans-serif" font-weight="900" font-size="52" letter-spacing="2" fill="#FFFFFF" text-anchor="middle">
    TOM
  </text>

  <!-- Badge TV Rojo con Letras Blancas -->
  <rect x="52" y="110" width="88" height="34" rx="10" fill="url(#iconBgGrad)" stroke="#FFA0A4" stroke-width="1.5" />
  <text x="96" y="134" font-family="'Outfit', sans-serif" font-weight="900" font-size="22" letter-spacing="3" fill="#FFFFFF" text-anchor="middle">
    TV
  </text>
</svg>
