name: Build TOM TV Release APK

on:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK Oficial TOM TV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17 Temurin
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Descargar Dependencias Flutter
        run: flutter pub get

      - name: Generar Iconos Oficiales de la Aplicación
        run: dart run flutter_launcher_icons

      - name: Compilar APK Release Oficial
        run: flutter build apk --release

      - name: Actualizar Archivo APK Raíz
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk TOM-TV-release.apk
          ls -lh TOM-TV-release.apk

      - name: Extraer Versión de pubspec.yaml
        id: get_version
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | head -n 1 | awk '{print $2}')
          VER_NAME=$(echo "$RAW_VERSION" | cut -d'+' -f1)
          VER_CODE=$(echo "$RAW_VERSION" | cut -d'+' -f2)
          echo "version_name=$VER_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VER_CODE" >> $GITHUB_OUTPUT
          echo "full_version=$RAW_VERSION" >> $GITHUB_OUTPUT
          echo "Compilando versión: $VER_NAME (Build $VER_CODE)"

      - name: Subir Artifact de GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: TOM-TV-v${{ steps.get_version.outputs.version_name }}-release
          path: TOM-TV-release.apk

      - name: Publicar Release Oficial en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version_name }}
          name: TOM TV v${{ steps.get_version.outputs.version_name }} Oficial (Build ${{ steps.get_version.outputs.version_code }})
          make_latest: true
          body: |
            ## 🚀 TOM TV v${{ steps.get_version.outputs.version_name }} Oficial (Build ${{ steps.get_version.outputs.version_code }})
            
            - 📺 **Nueva Interfaz Smart TV 10-foot UI (Estándar Netflix / Apple TV)**: Rediseño visual cinematográfico con paleta carbón `#0E0E10` y rojo `#E50914` optimizado para paneles OLED/LED sin empastes.
            - 🧭 **Menú Lateral Colapsable Inteligente**: Barra lateral de 72px a 240px con apertura suave en D-Pad Left y repliegue automático al navegar por el catálogo.
            - 🖼️ **Pósters Limpios y Metadata Dinámica**: Carátulas sin badges amontonados con resolución 4K UHD, audio latino, estrellas y año reflejados dinámicamente en el Hero Banner en tiempo real.
            - 📡 **Guía EPG en Vivo (2 Paneles)**: Pestañas de categorías superiores, lista vertical navegable y preview en vivo con sinopsis y programación a continuación (Enter/OK para pantalla completa).
            - ⚡ **2,000 Canales en Vivo Verificados**: Cobertura nacional e internacional completa auditada segmento a segmento con auto-sanación de enlaces y cero pantallas negras.
            - 💫 **Shimmer Skeletons y Caché en Memoria**: Eliminación total de pantallas negras y spinners circulares en transiciones y navegación.
            - ⚽ **Cuadrícula Cartesiana Deportiva**: Saltos de foco D-Pad 100% predecibles para fútbol peruano (Liga 1 Max) y cadenas internacionales (ESPN, Fox Sports, TyC, DSports).
          files: |
            TOM-TV-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar APK Compilado en Rama Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add TOM-TV-release.apk
          git commit -m "build: auto-compile official TOM-TV-release.apk v${{ steps.get_version.outputs.version_name }} (Build ${{ steps.get_version.outputs.version_code }})" || echo "Sin cambios detectados"
          git push origin main || echo "Push omitido"
