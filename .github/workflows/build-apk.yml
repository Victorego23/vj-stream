name: Build TOM TV Release APK

on:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK Oficial TOM TV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17 Temurin
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Descargar Dependencias Flutter
        run: flutter pub get

      - name: Generar Iconos Oficiales de la Aplicación
        run: dart run flutter_launcher_icons

      - name: Compilar APK Release Oficial
        run: flutter build apk --release

      - name: Actualizar Archivo APK Raíz
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk TOM-TV-release.apk
          ls -lh TOM-TV-release.apk

      - name: Extraer Versión de pubspec.yaml
        id: get_version
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | head -n 1 | awk '{print $2}')
          VER_NAME=$(echo "$RAW_VERSION" | cut -d'+' -f1)
          VER_CODE=$(echo "$RAW_VERSION" | cut -d'+' -f2)
          echo "version_name=$VER_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VER_CODE" >> $GITHUB_OUTPUT
          echo "full_version=$RAW_VERSION" >> $GITHUB_OUTPUT
          echo "Compilando versión: $VER_NAME (Build $VER_CODE)"

      - name: Subir Artifact de GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: TOM-TV-v${{ steps.get_version.outputs.version_name }}-release
          path: TOM-TV-release.apk

      - name: Publicar Release Oficial en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version_name }}
          name: TOM TV v${{ steps.get_version.outputs.version_name }} Oficial (Build ${{ steps.get_version.outputs.version_code }})
          make_latest: true
          body: |
            ## 🚀 TOM TV v${{ steps.get_version.outputs.version_name }} Oficial (Build ${{ steps.get_version.outputs.version_code }})
            
            - 👤 **Integración Completa de "Mi Cuenta" en Smart TV**: Pestaña dedicada de Perfil en la barra lateral del televisor para gestionar cuenta, activación, credenciales, control parental y actualizaciones exactamente igual que en el celular con soporte 100% control remoto D-Pad.
            - ⚡ **Resolución Precisa TorBox Multi-Archivo (Batch)**: Identificación y extracción exacta del `file_id` por temporada y episodio en torrents batch (como series y anime, ej. Pokémon) con soporte para nomenclatura de anime y paquetes multi-temporada.
            - ⏱️ **Timeouts Ampliados a 20s y Resiliencia**: Incremento del margen de espera en scrapers y APIs de Debrid/TorBox a 20 segundos para evitar cancelaciones prematuras en conexiones residenciales y Smart TV.
            - 📺 **Fallback Inteligente HEVC Main 10 / Android TV**: Detección automática de fallos de inicialización en decodificador por hardware y conmutación transparente a flujos seguros H.264 (AVC) 8-bit SDR.
            - 🎙️ **Doblaje Continuo 100% en Español**: Penalización estricta de versiones extendidas/híbridas con baches en inglés (ej. The Walking Dead) y prioridad absoluta a versiones WEB-DL/Retail oficiales con doblaje íntegro.
            - 📋 **Gestión de "Continuar Viendo" & Sincronización Reactiva**: Mutación reactiva instantánea en pantalla al confirmar "Quitar" (eliminación inmediata del carrusel sin latencia ni reinicio), persistencia local protegida con tombstones contra resurrección por caché, y nuevos endpoints de eliminación y limpieza masiva en la nube.
            - 📡 **444 Canales de TV en Vivo 100% Operativos**: Auditoría exhaustiva y auto-failover inteligente con cero enlaces caídos.
            - 📺 **Modo Smart TV Cinemático (10-Foot UI)**: Interfaz fluida estilo Apple TV/Netflix, halo neón de enfoque, reloj en vivo y controles remotos D-Pad.
          files: |
            TOM-TV-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar APK Compilado en Rama Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add TOM-TV-release.apk
          git commit -m "build: auto-compile official TOM-TV-release.apk v${{ steps.get_version.outputs.version_name }} (Build ${{ steps.get_version.outputs.version_code }})" || echo "Sin cambios detectados"
          git push origin main || echo "Push omitido"
